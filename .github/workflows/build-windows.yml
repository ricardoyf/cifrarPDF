name: Build PDF Cifrador Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pikepdf tkinterdnd2

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PDF_Cifrador --collect-all tkinterdnd2 --collect-all pikepdf pdf_cifrador.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Cifrador_Windows
          path: dist/PDF_Cifrador.exe
          if-no-files-found: error
